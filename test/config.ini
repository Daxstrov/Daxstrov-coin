# These environment variables are set by the build process and read by
# test/functional/test_runner.py and test/util/bitcoin-util-test.py

[environment]
PACKAGE_NAME=Daxstrov Core
PACKAGE_BUGREPORT=https://github.com/Daxstrov-project/Daxstrov/issues
SRCDIR=/mnt/c/users/abhishek/downloads/Daxstrov-coin-copy
BUILDDIR=/mnt/c/users/abhishek/downloads/Daxstrov-coin-copy
EXEEXT=
RPCAUTH=/mnt/c/users/abhishek/downloads/Daxstrov-coin-copy/share/rpcauth/rpcauth.py

[components]
